{% extends 'base.html' %}
{% block content %}

<div class="container" style="margin-top: 120px;">
    <!-- Progress Indicator -->
    <div class="progress-steps mb-5">
        <div class="step">
            <div class="step-number">1</div>
            <div class="step-label">Order Summary</div>
        </div>
        <div class="step-line"></div>
        <div class="step active">
            <div class="step-number">2</div>
            <div class="step-label">Shipping & Contact</div>
        </div>
        <div class="step-line"></div>
        <div class="step">
            <div class="step-number">3</div>
            <div class="step-label">Payment</div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-light">
                    <h4 class="mb-0">Shipping Address</h4>
                </div>
                <div class="card-body">
                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name *</label>
                                <input type="text" name="first_name" class="form-control" value="{{ order.first_name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" name="last_name" class="form-control" value="{{ order.last_name }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address *</label>
                            <input type="email" name="email" class="form-control" value="{{ order.email }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" name="phone" class="form-control" placeholder="+91 XXXXX XXXXX" value="{{ order.phone }}" pattern="[0-9+\-\s]{10,}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Street Address *</label>
                            <input type="text" name="address" class="form-control" placeholder="House number, building name" value="{{ order.address }}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">City *</label>
                                <input type="text" name="city" class="form-control" value="{{ order.city }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">State/Province *</label>
                                <input type="text" name="state" class="form-control" value="{{ order.state }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Postal Code *</label>
                                <input type="text" name="postal_code" class="form-control" placeholder="123456" pattern="[0-9]{6}" value="{{ order.postal_code }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Country</label>
                                <input type="text" name="country" class="form-control" value="India" disabled>
                                <input type="hidden" name="country" value="India">
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <a href="/checkout/order-summary/" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-2"></i> Back
                            </a>
                            <button type="submit" class="btn btn-imperial">
                                Continue to Payment <i class="bi bi-arrow-right ms-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm sticky-top" style="top: 120px;">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Order Total</h5>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span>₹ {{ total }}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Shipping:</span>
                        <span class="text-success">FREE</span>
                    </div>
                    <div class="d-flex justify-content-between fs-5 fw-bold border-top pt-2">
                        <span>Total:</span>
                        <span class="text-success">₹ {{ total }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.progress-steps {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

.step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
}

.step-number {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #666;
    border: 2px solid #ddd;
}

.step.active .step-number {
    background: #d4a574;
    color: white;
    border-color: #d4a574;
}

.step-label {
    font-size: 0.9rem;
    color: #666;
    min-width: 80px;
}

.step.active .step-label {
    color: #d4a574;
    font-weight: 600;
}

.step-line {
    height: 2px;
    width: 50px;
    background: #ddd;
    margin: 0 10px;
}

.step-line.active {
    background: #d4a574;
}

.sticky-top {
    top: 120px;
}
</style>

<script>
// Form validation
document.querySelectorAll('.needs-validation').forEach(function (form) {
    form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        }
        form.classList.add('was-validated');
    }, false);
});
</script>

{% endblock %}
