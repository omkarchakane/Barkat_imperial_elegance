{% extends 'base.html' %}
{% block content %}

<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh; margin-top: 80px;">
    <div class="card shadow-lg border-0 p-5" style="max-width: 420px; width: 100%;">
        <h3 class="text-center mb-2" style="font-family: 'Playfair Display', serif; color: var(--primary-color);">Verify Email</h3>
        <p class="text-muted text-center small mb-4">We sent a 6-digit code to <strong>{{ pending_email }}</strong></p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label text-muted">Verification Code</label>
                <input type="text" name="otp" class="form-control form-control-imperial" minlength="6" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required>
            </div>
            <button class="btn btn-add-cart w-100 py-2 mb-2">Verify & Create Account</button>
        </form>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="resend">
            <button type="submit" class="btn btn-outline-secondary w-100 py-2">Resend Code</button>
        </form>

        <div class="text-center mt-3">
            <a href="/register" class="text-muted text-decoration-none small">Change email</a>
        </div>
    </div>
</div>

{% endblock %}
