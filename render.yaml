services:
  - type: web
    name: barkat-imperial-elegance
    runtime: python
    rootDir: Barkat_imperial_elegance
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --noinput && gunicorn barkat.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DJANGO_SETTINGS_MODULE
        value: barkat.settings
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: barkat-db
          property: connectionString
      - key: USE_CLOUDINARY
        value: true
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: barkat-db
